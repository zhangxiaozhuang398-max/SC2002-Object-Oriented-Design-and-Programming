<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Rush</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">🍽️</span>
    <div>
      <div class="brand-title" data-i18n="appTitle">餐厅大作战</div>
      <div class="brand-sub" id="stageName"></div>
    </div>
  </div>
  <div class="turn-track" id="turnTrack" aria-live="polite">
    <div class="turn-label" id="turnLabel">—</div>
    <div class="turn-ticks" id="turnTicks"></div>
  </div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="helpBtn" data-i18n-title="helpTitle" title="玩法说明">?</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh" class="lang-btn active">中文</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
    </div>
  </div>
</header>

<div class="offline" id="offline" hidden></div>

<section class="goals" id="goals" aria-label="Goals"></section>

<main class="board">
  <aside class="control" id="control">
    <section class="card turn-card" id="turnCard"></section>
  </aside>

  <section class="card area-dining">
    <h2><span class="icon">🍽️</span><span data-i18n="tablesTitle">用餐区</span></h2>
    <div id="tableList" class="table-grid"></div>
  </section>

  <section class="card area-queue">
    <h2><span class="icon">🧍</span><span data-i18n="queueTitle">等待队列</span><span class="count" id="queueCount"></span></h2>
    <div id="queueList" class="stack"></div>
    <p class="note" id="arrivalNote"></p>
  </section>

  <section class="card area-kitchen">
    <h2><span class="icon">🍳</span><span data-i18n="kitchenTitle">厨房</span><span class="count" id="kitchenCount"></span></h2>
    <div id="orderList" class="stack"></div>
  </section>

  <section class="card area-history">
    <h2><span class="icon">🧾</span><span data-i18n="historyTitle">已离店顾客</span></h2>
    <div id="historyList" class="stack"></div>
  </section>

  <section class="card area-log">
    <h2><span class="icon">📜</span><span data-i18n="logTitle">营业日志</span></h2>
    <div id="logList" class="log"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="welcome" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div id="welcomeBody"></div>
  </div>
</div>

<div class="overlay" id="results" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultsTitle">
    <div id="resultsBody"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
